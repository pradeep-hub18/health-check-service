{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: the MVP scheduler has no distributed ownership" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "health-check-service.fullname" . }}
  labels:
    {{- include "health-check-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "health-check-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.database.image | quote }}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          env:
            - name: DB_HOST
              value: {{ printf "%s-postgres" (include "health-check-service.fullname" .) }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: health-check-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: {{ printf "%s-postgres" (include "health-check-service.fullname" .) }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: SCHEDULER_MAX_WORKERS
              value: {{ .Values.scheduler.maxWorkers | quote }}
            - name: CHECK_TIMEOUT_SECONDS
              value: {{ .Values.scheduler.checkTimeoutSeconds | quote }}
            - name: ALLOW_PRIVATE_ENDPOINTS
              value: {{ .Values.scheduler.allowPrivateEndpoints | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 2
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 2
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 7
            failureThreshold: 3
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
