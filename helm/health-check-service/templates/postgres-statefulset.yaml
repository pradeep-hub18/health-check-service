apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-postgres" (include "health-check-service.fullname" .) }}
  labels:
    {{- include "health-check-service.labels" . | nindent 4 }}
spec:
  serviceName: {{ printf "%s-postgres" (include "health-check-service.fullname" .) }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "health-check-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          args: ["-p", {{ .Values.database.port | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -p {{ .Values.database.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -p {{ .Values.database.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # No liveness probe: a slow recovery should not repeatedly kill PostgreSQL.
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if ne .Values.database.storageClass nil }}
        storageClassName: {{ .Values.database.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage | quote }}
