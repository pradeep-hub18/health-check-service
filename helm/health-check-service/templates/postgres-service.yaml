apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-postgres" (include "health-check-service.fullname" .) }}
  labels:
    {{- include "health-check-service.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
