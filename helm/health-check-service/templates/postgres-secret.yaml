{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "health-check-service.secretName" . }}
  labels:
    {{- include "health-check-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ required "Set database.existingSecret (recommended) or supply database.password securely" .Values.database.password | quote }}
{{- end }}
